<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html, body { margin:0; overflow:hidden; background:#000; }
  #title {
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-family:monospace;
    font-size:18px;
    pointer-events:none;
    z-index:1;
  }
</style>
</head>
<body>
<div id="title">Three.js Impressive Scene</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ----- Basic setup ---------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 2, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ----- Lights --------------------------------------------------------------
const hemiLight = new THREE.HemisphereLight(0xeeeeff, 0x080820, 1.2);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// ----- Geometry -------------------------------------------------------------
const group = new THREE.Group();
scene.add(group);

// A glowing torus knot
const knotGeo = new THREE.TorusKnotGeometry(1, 0.35, 150, 20);
const knotMat = new THREE.MeshStandardMaterial({
  color: 0xff6f61,
  metalness: 0.7,
  roughness: 0.2,
  emissive: 0x330000,
  emissiveIntensity: 0.5
});
const knot = new THREE.Mesh(knotGeo, knotMat);
group.add(knot);

// A rotating sphere with reflective material
const sphereGeo = new THREE.SphereGeometry(0.6, 64, 64);
const sphereMat = new THREE.MeshPhysicalMaterial({
  color: 0x61a0ff,
  metalness: 1,
  roughness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.1,
  reflectivity: 1
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.set(-2.5, 0, 0);
group.add(sphere);

// Small floating cubes for extra flair
for (let i = 0; i < 12; i++) {
  const size = Math.random() * 0.2 + 0.1;
  const geo = new THREE.BoxGeometry(size, size, size);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(Math.random(), 0.8, 0.5)
  });
  const cube = new THREE.Mesh(geo, mat);
  cube.position.set(
    (Math.random() - 0.5) * 6,
    (Math.random() - 0.5) * 4,
    (Math.random() - 0.5) * 6
  );
  group.add(cube);
}

// ----- Mouse drag rotation -------------------------------------------------
let isDragging = false;
let previousMouse = { x: 0, y: 0 };
const rotationSpeed = 0.005;

renderer.domElement.addEventListener('pointerdown', (e) => {
  isDragging = true;
  previousMouse.x = e.clientX;
  previousMouse.y = e.clientY;
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const deltaX = e.clientX - previousMouse.x;
  const deltaY = e.clientY - previousMouse.y;
  previousMouse.x = e.clientX;
  previousMouse.y = e.clientY;

  // Rotate around world Y (horizontal drag) and X (vertical drag)
  group.rotation.y += deltaX * rotationSpeed;
  group.rotation.x += deltaY * rotationSpeed;
  // Clamp X rotation to avoid flipping
  group.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, group.rotation.x));
});

renderer.domElement.addEventListener('pointerup', () => { isDragging = false; });
renderer.domElement.addEventListener('pointerleave', () => { isDragging = false; });

// ----- Resize handling ------------------------------------------------------
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

// ----- Animation loop -------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);

  // subtle auto‑rotation when not dragging
  if (!isDragging) {
    group.rotation.y += 0.001;
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
