<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #title {
        position:absolute;
        top:10px; left:10px;
        color:#fff;
        font-family:monospace;
        font-size:14px;
        pointer-events:none;
        user-select:none;
    }
</style>
</head>
<body>
<div id="title">Three.js Demo – Drag to rotate</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Scene & Camera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 6);
    scene.add(camera);

    // Resize handling
    window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    });

    // Lighting
    const ambient = new THREE.AmbientLight(0x404040, 1.5);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(5,10,7);
    scene.add(dirLight);
    const pointLight = new THREE.PointLight(0xffaa00, 1.2, 100);
    pointLight.position.set(-5,5,5);
    scene.add(pointLight);

    // Group to rotate
    const group = new THREE.Group();
    scene.add(group);

    // Add some visually impressive objects
    const geometry1 = new THREE.TorusKnotGeometry(1, 0.3, 200, 32);
    const material1 = new THREE.MeshStandardMaterial({ color: 0x156289, emissive: 0x072534, metalness: 0.7, roughness: 0.2 });
    const torusKnot = new THREE.Mesh(geometry1, material1);
    group.add(torusKnot);

    const geometry2 = new THREE.IcosahedronGeometry(0.8, 0);
    const material2 = new THREE.MeshStandardMaterial({ color: 0xffc107, emissive: 0x331100, metalness: 0.4, roughness: 0.5 });
    const ico = new THREE.Mesh(geometry2, material2);
    ico.position.set(2.5, 0, 0);
    group.add(ico);

    // Add a floor plane
    const planeGeo = new THREE.PlaneGeometry(20,20);
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI/2;
    plane.position.y = -1.5;
    scene.add(plane);

    // Add some floating particles
    const particles = new THREE.Group();
    const particleGeo = new THREE.SphereGeometry(0.05, 8, 8);
    const particleMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    for(let i=0;i<100;i++){
        const p = new THREE.Mesh(particleGeo, particleMat);
        p.position.set(
            (Math.random()-0.5)*6,
            Math.random()*3,
            (Math.random()-0.5)*6
        );
        particles.add(p);
    }
    group.add(particles);

    // Mouse drag rotation
    let isDragging = false;
    let previousMouse = { x:0, y:0 };
    const rotationSpeed = 0.005;

    const onPointerDown = (e) => {
        isDragging = true;
        previousMouse.x = e.clientX;
        previousMouse.y = e.clientY;
    };
    const onPointerMove = (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMouse.x;
        const deltaY = e.clientY - previousMouse.y;
        group.rotation.y += deltaX * rotationSpeed;
        group.rotation.x += deltaY * rotationSpeed;
        previousMouse.x = e.clientX;
        previousMouse.y = e.clientY;
    };
    const onPointerUp = () => { isDragging = false; };

    renderer.domElement.addEventListener('mousedown', onPointerDown);
    renderer.domElement.addEventListener('mousemove', onPointerMove);
    renderer.domElement.addEventListener('mouseup', onPointerUp);
    renderer.domElement.addEventListener('mouseleave', onPointerUp);

    // Touch support
    renderer.domElement.addEventListener('touchstart', (e)=> {
        if (e.touches.length===1){
            const t = e.touches[0];
            onPointerDown({clientX:t.clientX, clientY:t.clientY});
        }
    }, {passive:true});
    renderer.domElement.addEventListener('touchmove', (e)=> {
        if (e.touches.length===1){
            const t = e.touches[0];
            onPointerMove({clientX:t.clientX, clientY:t.clientY});
        }
    }, {passive:true});
    renderer.domElement.addEventListener('touchend', onPointerUp);

    // Animation loop
    const clock = new THREE.Clock();
    function animate(){
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        // Slow auto-rotation
        group.rotation.y += 0.1 * delta;

        // Slight up-and-down bobbing for particles
        particles.children.forEach((p,i)=>{
            p.position.y += Math.sin(clock.elapsedTime*2 + i)*0.001;
        });

        renderer.render(scene, camera);
    }
    animate();
})();
</script>
</body>
</html>
