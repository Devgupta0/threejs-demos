<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; }
  #title {
    position:absolute; top:10px; left:10px;
    color:#fff; font-family:monospace; font-size:18px;
    pointer-events:none;
    user-select:none;
  }
</style>
</head>
<body>
<div id="title">Three.js 3D Demo</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 2, 6);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x000000);
  document.body.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0x404040, 2);
  scene.add(ambient);

  const point1 = new THREE.PointLight(0xff0040, 2, 30);
  point1.position.set(5, 5, 5);
  scene.add(point1);

  const point2 = new THREE.PointLight(0x00ff80, 2, 30);
  point2.position.set(-5, -5, -5);
  scene.add(point2);

  const point3 = new THREE.PointLight(0x0040ff, 2, 30);
  point3.position.set(0, 5, -5);
  scene.add(point3);

  // Group for objects
  const group = new THREE.Group();
  scene.add(group);

  // Torus Knot
  const knotGeo = new THREE.TorusKnotGeometry(1, 0.3, 150, 20);
  const knotMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    metalness: 0.8,
    roughness: 0.2,
    envMapIntensity: 1
  });
  const knot = new THREE.Mesh(knotGeo, knotMat);
  group.add(knot);

  // Sphere
  const sphereGeo = new THREE.SphereGeometry(0.7, 32, 32);
  const sphereMat = new THREE.MeshStandardMaterial({
    color: 0xffaa00,
    metalness: 0.5,
    roughness: 0.4
  });
  const sphere = new THREE.Mesh(sphereGeo, sphereMat);
  sphere.position.set(-2.5, 0, 0);
  group.add(sphere);

  // Box
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const boxMat = new THREE.MeshStandardMaterial({
    color: 0x00aaff,
    metalness: 0.3,
    roughness: 0.6
  });
  const box = new THREE.Mesh(boxGeo, boxMat);
  box.position.set(2.5, 0, 0);
  group.add(box);

  // Simple floor
  const floorGeo = new THREE.PlaneGeometry(20, 20);
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x222222,
    metalness: 0,
    roughness: 1
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -1.5;
  scene.add(floor);

  // Resize handling
  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  // Mouse drag rotation
  let isDragging = false;
  let previousMouse = { x: 0, y: 0 };
  let startRot = { x: 0, y: 0 };

  const onPointerDown = (e) => {
    isDragging = true;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
    startRot.x = group.rotation.x;
    startRot.y = group.rotation.y;
  };

  const onPointerMove = (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMouse.x;
    const deltaY = e.clientY - previousMouse.y;
    group.rotation.y = startRot.y + deltaX * 0.005;
    group.rotation.x = startRot.x + deltaY * 0.005;
  };

  const onPointerUp = () => { isDragging = false; };

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
  renderer.domElement.addEventListener('pointerleave', onPointerUp);

  // Animation loop
  const animate = () => {
    requestAnimationFrame(animate);
    // Slow auto-rotation when not dragging
    if (!isDragging) {
      group.rotation.y += 0.001;
    }
    renderer.render(scene, camera);
  };
  animate();
})();
</script>
</body>
</html>
