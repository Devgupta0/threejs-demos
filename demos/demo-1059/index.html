<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; }
  #title {
    position:absolute; top:10px; left:10px;
    color:#fff; font-family:monospace; font-size:18px;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="title">Three.js 3D Demo</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const scene = new THREE.Scene();

  // Camera
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 6);
  camera.lookAt(0, 0, 0);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x000000);
  document.body.appendChild(renderer.domElement);

  // Resize handling
  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  // Lights
  const ambient = new THREE.AmbientLight(0x404040, 1.5);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  const point1 = new THREE.PointLight(0xff0040, 1, 30);
  point1.position.set(5, 2, 0);
  scene.add(point1);

  const point2 = new THREE.PointLight(0x00ff80, 1, 30);
  point2.position.set(-5, 2, 0);
  scene.add(point2);

  // Objects group (will be rotated by mouse)
  const group = new THREE.Group();
  scene.add(group);

  // Ground plane
  const planeGeo = new THREE.PlaneGeometry(40, 40);
  const planeMat = new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide });
  const plane = new THREE.Mesh(planeGeo, planeMat);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -1.5;
  group.add(plane);

  // Torus Knot
  const knotGeo = new THREE.TorusKnotGeometry(1, 0.35, 150, 20);
  const knotMat = new THREE.MeshStandardMaterial({ 
    color: 0x156289, 
    emissive: 0x072534, 
    metalness: 0.7, 
    roughness: 0.2,
    flatShading: true
  });
  const knot = new THREE.Mesh(knotGeo, knotMat);
  knot.position.y = 0.5;
  group.add(knot);

  // Rotating Icosahedron
  const icoGeo = new THREE.IcosahedronGeometry(0.8, 0);
  const icoMat = new THREE.MeshStandardMaterial({ 
    color: 0xffaa00, 
    emissive: 0x552200, 
    metalness: 0.5, 
    roughness: 0.4 
  });
  const ico = new THREE.Mesh(icoGeo, icoMat);
  ico.position.set(-2, 0, -1);
  group.add(ico);

  // Small floating spheres
  const sphereGeo = new THREE.SphereGeometry(0.2, 16, 16);
  const colors = [0xff0040, 0x00ff80, 0x0040ff, 0xffff00];
  for (let i = 0; i < 20; i++) {
    const mat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length] });
    const sphere = new THREE.Mesh(sphereGeo, mat);
    sphere.position.set(
      (Math.random() - 0.5) * 6,
      Math.random() * 3,
      (Math.random() - 0.5) * 6
    );
    group.add(sphere);
  }

  // Mouse drag rotation
  let isDragging = false;
  let previousMouse = { x: 0, y: 0 };
  const rotationSpeed = 0.005;

  const onPointerDown = (e) => {
    isDragging = true;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
  };
  const onPointerMove = (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMouse.x;
    const deltaY = e.clientY - previousMouse.y;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;

    // Rotate around Y (horizontal drag) and X (vertical drag)
    group.rotation.y += deltaX * rotationSpeed;
    group.rotation.x += deltaY * rotationSpeed;
    // Clamp X rotation to avoid flipping
    group.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, group.rotation.x));
  };
  const onPointerUp = () => {
    isDragging = false;
  };

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
  renderer.domElement.addEventListener('pointerleave', onPointerUp);

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    // Slight autonomous rotation for visual interest
    knot.rotation.x += 0.006;
    knot.rotation.y += 0.004;
    ico.rotation.y += 0.008;
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
