<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js 3D Scene</title>
<style>
    html, body {
        margin: 0;
        overflow: hidden;
        background: #000;
        width: 100vw;
        height: 100vh;
    }
    #title {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #fff;
        font-family: monospace;
        font-size: 1.2rem;
        z-index: 10;
        pointer-events: none;
    }
</style>
</head>
<body>
<div id="title">My 3D Scene</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
    // Scene, Camera, Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 2, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0x555555, 0x111122, 0.8);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffaa33, 1.5, 100);
    pointLight.position.set(-3, 3, 2);
    scene.add(pointLight);

    // Group to hold everything (will be rotated)
    const group = new THREE.Group();
    scene.add(group);

    // Torus Knot
    const knotGeom = new THREE.TorusKnotGeometry(1, 0.3, 150, 20);
    const knotMat = new THREE.MeshStandardMaterial({
        color: 0x00ffcc,
        metalness: 0.6,
        roughness: 0.2,
        emissive: 0x004433,
        emissiveIntensity: 0.3
    });
    const knot = new THREE.Mesh(knotGeom, knotMat);
    group.add(knot);

    // Reflective Sphere
    const sphereGeom = new THREE.SphereGeometry(0.6, 32, 32);
    const sphereMat = new THREE.MeshStandardMaterial({
        color: 0x3366ff,
        metalness: 1,
        roughness: 0.05,
        envMapIntensity: 1
    });
    const sphere = new THREE.Mesh(sphereGeom, sphereMat);
    sphere.position.set(2.5, 0.5, -1);
    group.add(sphere);

    // Small floating cubes
    const cubeGeom = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    for (let i = 0; i < 30; i++) {
        const cubeMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
            metalness: 0.3,
            roughness: 0.6
        });
        const cube = new THREE.Mesh(cubeGeom, cubeMat);
        cube.position.set(
            (Math.random() - 0.5) * 6,
            (Math.random() - 0.5) * 4 + 1,
            (Math.random() - 0.5) * 6
        );
        group.add(cube);
    }

    // Starfield (points)
    const starsGeom = new THREE.BufferGeometry();
    const starCount = 800;
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 100;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
    }
    starsGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3 });
    const stars = new THREE.Points(starsGeom, starsMat);
    scene.add(stars);

    // Mouse drag rotation
    let isDragging = false;
    let previousMouse = { x: 0, y: 0 };
    const rotationSpeed = 0.005;

    const onPointerDown = (e) => {
        isDragging = true;
        previousMouse.x = e.clientX;
        previousMouse.y = e.clientY;
    };

    const onPointerMove = (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMouse.x;
        const deltaY = e.clientY - previousMouse.y;
        previousMouse.x = e.clientX;
        previousMouse.y = e.clientY;

        group.rotation.y += deltaX * rotationSpeed;
        group.rotation.x += deltaY * rotationSpeed;
        // Clamp vertical rotation
        const limit = Math.PI / 2;
        group.rotation.x = Math.max(-limit, Math.min(limit, group.rotation.x));
    };

    const onPointerUp = () => {
        isDragging = false;
    };

    renderer.domElement.addEventListener('mousedown', onPointerDown);
    renderer.domElement.addEventListener('mousemove', onPointerMove);
    renderer.domElement.addEventListener('mouseup', onPointerUp);
    renderer.domElement.addEventListener('mouseleave', onPointerUp);
    // Touch support
    renderer.domElement.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            const touch = e.touches[0];
            onPointerDown({ clientX: touch.clientX, clientY: touch.clientY });
        }
    });
    renderer.domElement.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
            const touch = e.touches[0];
            onPointerMove({ clientX: touch.clientX, clientY: touch.clientY });
        }
    });
