<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html,body { margin:0; overflow:hidden; height:100%; background:#000; }
  #title {
    position:absolute;
    top:10px; left:10px;
    color:#fff;
    font-family:monospace;
    font-size:1.2rem;
    pointer-events:none;
    z-index:10;
  }
  canvas { display:block; } /* remove scrollbars */
</style>
</head>
<body>
<div id="title">Three.js Impressive Scene</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const scene = new THREE.Scene();

  // Camera
  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 2, 6);
  camera.lookAt(0, 0, 0);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x000000);
  document.body.appendChild(renderer.domElement);

  // Resize handling
  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  // Lights
  const ambient = new THREE.AmbientLight(0x404040, 1.5);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);
  const pointLight = new THREE.PointLight(0xffaa33, 1.2, 50);
  pointLight.position.set(-5, 5, -5);
  scene.add(pointLight);

  // Group for mouse rotation
  const group = new THREE.Group();
  scene.add(group);

  // Objects
  const geometry = new THREE.TorusKnotGeometry(1, 0.3, 200, 32);
  const material = new THREE.MeshStandardMaterial({
    color: 0x1565c0,
    metalness: 0.6,
    roughness: 0.2,
    envMapIntensity: 1
  });
  const torusKnot = new THREE.Mesh(geometry, material);
  group.add(torusKnot);

  // Add floating spheres
  const sphereGeo = new THREE.SphereGeometry(0.2, 32, 32);
  for (let i = 0; i < 30; i++) {
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
      metalness: 0.3,
      roughness: 0.5
    });
    const sphere = new THREE.Mesh(sphereGeo, mat);
    sphere.position.set(
      (Math.random() - 0.5) * 6,
      (Math.random() - 0.5) * 4,
      (Math.random() - 0.5) * 6
    );
    group.add(sphere);
  }

  // Simple drag rotation
  let isDragging = false;
  let previousMouse = { x: 0, y: 0 };
  const rotateSpeed = 0.005;

  const onPointerDown = (e) => {
    isDragging = true;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
  };
  const onPointerMove = (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMouse.x;
    const deltaY = e.clientY - previousMouse.y;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;

    group.rotation.y += deltaX * rotateSpeed;
    group.rotation.x += deltaY * rotateSpeed;
    // Clamp X rotation to avoid flipping
    group.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, group.rotation.x));
  };
  const onPointerUp = () => { isDragging = false; };

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointerleave', onPointerUp);

  // Animation loop
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    // Slowly spin the torus knot on its own axis
    torusKnot.rotation.x += delta * 0.5;
    torusKnot.rotation.y += delta * 0.3;

    // Slight up‑down bobbing for the whole group
    group.position.y = Math.sin(clock.elapsedTime * 0.5) * 0.1;

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
