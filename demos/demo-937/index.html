```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abandoned Underwater Research Facility</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            font-family: monospace;
        }
        #title {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="title">Abandoned Underwater Research Facility</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, fish, plants, architecture;
        let rotX = 0, rotY = 0;
        let dragging = false;
        let lastX, lastY;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.AmbientLight(0x444444);
            scene.add(light);

            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(0, 0, 5);
            scene.add(pointLight);

            architecture = new THREE.Group();
            scene.add(architecture);

            for (let i = 0; i < 10; i++) {
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshPhongMaterial({ color: 0x668888, specular: 0x333333 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * 10 - 5);
                architecture.add(mesh);
            }

            plants = new THREE.Group();
            scene.add(plants);

            for (let i = 0; i < 50; i++) {
                const geometry = new THREE.SphereGeometry(0.1, 16, 16);
                const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, opacity: 0.5, transparent: true });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * 10 - 5);
                plants.add(mesh);
            }

            fish = new THREE.Group();
            scene.add(fish);

            for (let i = 0; i < 20; i++) {
                const geometry = new THREE.SphereGeometry(0.2, 16, 16);
                const material = new THREE.MeshBasicMaterial({ color: 0x66cccc, opacity: 0.7, transparent: true });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * 10 - 5);
                fish.add(mesh);
            }

            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function animate() {
            requestAnimationFrame(animate);

            rotX += 0.001;
            rotY += 0.001;

            camera.rotation.x = rotX;
            camera.rotation.y = rotY;

            fish.position.x += 0.01;
            if (fish.position.x > 10) {
                fish.position.x = -10;
            }

            renderer.render(scene, camera);
        }

        function onMouseDown(event) {
            dragging = true;
            lastX = event.clientX;
            lastY = event.clientY;
        }

        function onMouseMove(event) {
            if (dragging) {
                rotX += (event.clientY - lastY) * 0.01;
                rotY += (event.clientX - lastX) * 0.01;
                lastX = event.clientX;
                lastY = event.clientY;
            }
        }

        function onMouseUp() {
            dragging = false;
        }
    </script>
</body>
</html>
