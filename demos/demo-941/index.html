<!DOCTYPE html>
<html>
<head>
    <title>Procedural Galaxy</title>
    <style>
        body { margin: 0; }
        #title { position: absolute; top: 0; left: 0; font-family: monospace; color: white; }
    </style>
</head>
<body>
    <div id="title">Procedural Galaxy</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let camera, scene, renderer, wormhole;
        let stars = [], nebulae = [];
        let rotX = 0, rotY = 0;
        let dragStartX, dragStartY;
        let isDragging = false;

        init();
        animate();

        function init() {
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 500;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2c0033);

            const gradient = new THREE.CanvasTexture(getGradientCanvas(256, 256));
            const gradientMaterial = new THREE.MeshBasicMaterial({ map: gradient });
            const gradientMesh = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), gradientMaterial);
            gradientMesh.position.z = -1000;
            scene.add(gradientMesh);

            wormhole = new THREE.Mesh(new THREE.TorusGeometry(100, 20, 16, 60), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            wormhole.position.z = -500;
            scene.add(wormhole);

            for (let i = 0; i < 1000; i++) {
                const star = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                star.position.x = Math.random() * 2000 - 1000;
                star.position.y = Math.random() * 2000 - 1000;
                star.position.z = Math.random() * 2000 - 1000;
                scene.add(star);
                stars.push(star);
            }

            for (let i = 0; i < 500; i++) {
                const nebula = new THREE.Mesh(new THREE.SphereGeometry(Math.random() * 20 + 10, 32, 32), new THREE.MeshBasicMaterial({ color: new THREE.Color(Math.random(), Math.random(), Math.random()) }));
                nebula.position.x = Math.random() * 2000 - 1000;
                nebula.position.y = Math.random() * 2000 - 1000;
                nebula.position.z = Math.random() * 2000 - 1000;
                scene.add(nebula);
                nebulae.push(nebula);
            }

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            document.addEventListener('mousedown', (e) => {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    rotX += (e.clientY - dragStartY) * 0.01;
                    rotY += (e.clientX - dragStartX) * 0.01;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.x = rotX;
            camera.rotation.y = rotY;

            wormhole.rotation.y += 0.001;

            for (let i = 0; i < stars.length; i++) {
                stars[i].position.z += 0.1;
                if (stars[i].position.z > 1000) {
                    stars[i].position.z = -1000;
                    stars[i].position.x = Math.random() * 2000 - 1000;
                    stars[i].position.y = Math.random() * 2000 - 1000;
                }
            }

            for (let i = 0; i < nebulae.length; i++) {
                nebulae[i].scale.set(Math.sin(Date.now() * 0.001 + i) * 0.1 + 1, Math.sin(Date.now() * 0.001 + i) * 0.1 + 1, Math.sin(Date.now() * 0.001 + i) * 0.1 + 1);
            }

            renderer.render(scene, camera);
        }

        function getGradientCanvas(width, height) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#ff69b4');
            gradient.addColorStop(0.5, '#33ccff');
            gradient.addColorStop(1, '#2c0033');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            return canvas;
        }
    </script>
</body>
</html>
