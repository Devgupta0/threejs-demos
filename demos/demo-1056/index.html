<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #title {
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-family:monospace;
    font-size:20px;
    z-index:1;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="title">Three.js 3D Demo</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // Scene, Camera, Renderer
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 6);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x000000);
  document.body.appendChild(renderer.domElement);

  // Group for mouse rotation
  const sceneGroup = new THREE.Group();
  scene.add(sceneGroup);

  // Lights
  const ambient = new THREE.AmbientLight(0x404040, 1.5);
  scene.add(ambient);
  const directional = new THREE.DirectionalLight(0xffffff, 2);
  directional.position.set(5, 10, 7);
  scene.add(directional);

  // Objects
  const torusKnot = new THREE.Mesh(
    new THREE.TorusKnotGeometry(1, 0.3, 150, 20),
    new THREE.MeshStandardMaterial({ color: 0xff6600, metalness: 0.5, roughness: 0.2 })
  );
  torusKnot.rotation.x = Math.PI / 2;
  sceneGroup.add(torusKnot);

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0x00aaff, emissive: 0x112244, metalness: 0.3, roughness: 0.7 })
  );
  sphere.position.set(-2, 0.5, 0);
  sceneGroup.add(sphere);

  const box = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.8, 0.8),
    new THREE.MeshStandardMaterial({ color: 0x66ff66, metalness: 0.1, roughness: 0.8 })
  );
  box.position.set(2, 0.4, -1);
  sceneGroup.add(box);

  // Ground plane (just for visual reference)
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide })
  );
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -0.01;
  scene.add(plane);

  // Mouse drag rotation
  let isDragging = false;
  const toRad = Math.PI / 180;
  const rotationSpeed = 0.2; // degrees per pixel

  const mouse = { x: 0, y: 0 };
  const prevMouse = { x: 0, y: 0 };

  function onMouseDown(event) {
    isDragging = true;
    prevMouse.x = event.clientX;
    prevMouse.y = event.clientY;
  }

  function onMouseMove(event) {
    if (!isDragging) return;
    mouse.x = event.clientX;
    mouse.y = event.clientY;

    const deltaX = mouse.x - prevMouse.x;
    const deltaY = mouse.y - prevMouse.y;

    const euler = new THREE.Euler(
      toRad(deltaY * rotationSpeed),
      toRad(deltaX * rotationSpeed),
      0,
      'XYZ'
    );
    const quat = new THREE.Quaternion().setFromEuler(euler);
    sceneGroup.quaternion.multiplyQuaternions(quat, sceneGroup.quaternion);

    prevMouse.x = mouse.x;
    prevMouse.y = mouse.y;
  }

  function onMouseUp() {
    isDragging = false;
  }

  renderer.domElement.addEventListener('mousedown', onMouseDown);
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  window.addEventListener('mouseleave', onMouseUp);

  // Resize handling
  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    // Slow auto-rotation for extra dynamism
    sceneGroup.rotation.y += 0.001;
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
