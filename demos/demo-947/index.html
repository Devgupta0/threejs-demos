<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abandoned Underwater Garden</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            font-family: monospace;
        }
        #title {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="title">Abandoned Underwater Garden</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, fish, seaweed, light;
        let rotX = 0, rotY = 0;
        let mouseDown = false, lastX, lastY;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({
                canvas: document.createElement('canvas'),
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            light = new THREE.PointLight(0xffffff, 1, 100);
            light.position.set(0, 0, -10);
            scene.add(light);

            let ambientLight = new THREE.AmbientLight(0x444444);
            scene.add(ambientLight);

            let sunLight = new THREE.DirectionalLight(0xffcc00, 0.5);
            sunLight.position.set(10, 10, -10);
            scene.add(sunLight);

            let geometry = new THREE.SphereGeometry(0.1, 32, 32);
            let material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            for (let i = 0; i < 100; i++) {
                let mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * 10 - 5);
                scene.add(mesh);
            }

            geometry = new THREE.PlaneGeometry(1, 1);
            material = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 });
            for (let i = 0; i < 10; i++) {
                let mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * 10 - 5);
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                scene.add(mesh);
            }

            fish = [];
            geometry = new THREE.SphereGeometry(0.05, 32, 32);
            material = new THREE.MeshBasicMaterial({ color: 0x00ccff });
            for (let i = 0; i < 50; i++) {
                let mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * 10 - 5);
                fish.push(mesh);
                scene.add(mesh);
            }

            seaweed = [];
            geometry = new THREE.PlaneGeometry(0.1, 1);
            material = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
            for (let i = 0; i < 10; i++) {
                let mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * 10 - 5);
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                seaweed.push(mesh);
                scene.add(mesh);
            }

            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.x = rotX;
            camera.rotation.y = rotY;

            for (let i = 0; i < fish.length; i++) {
                fish[i].position.x += Math.random() * 0.01 - 0.005;
                fish[i].position.y += Math.random() * 0.01 - 0.005;
                fish[i].position.z += Math.random() * 0.01 - 0.005;
            }

            for (let i = 0; i < seaweed.length; i++) {
                seaweed[i].rotation.x += 0.01;
                seaweed[i].rotation.y += 0.01;
            }

            renderer.render(scene, camera);
        }

        function onMouseDown(event) {
            mouseDown = true;
            lastX = event.clientX;
            lastY = event.clientY;
        }

        function onMouseMove(event) {
            if (mouseDown) {
                rotX += (event.clientY - lastY) * 0.01;
                rotY += (event.clientX - lastX) * 0.01;
                lastX = event.clientX;
                lastY = event.clientY;
            }
        }

        function onMouseUp() {
            mouseDown = false;
        }
    </script>
</body>
</html>
