<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Neon Underwater Metropolis</title>
  <style>
    body { margin: 0; }
    #title { position: absolute; top: 10px; left: 10px; font-family: monospace; color: white; }
  </style>
</head>
<body>
  <div id="title">Neon Underwater Metropolis</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, mesh, fishMesh, title;
    let rotationX = 0, rotationY = 0;
    let isDragging = false, prevX, prevY;
    let waves = [];
    let fish = [];

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.Fog(0x000000, 100, 500);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 200;

      renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      let geometry = new THREE.BoxGeometry(100, 100, 100);
      let material = new THREE.MeshPhongMaterial({ color: 0xffffff });
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      let fishGeometry = new THREE.SphereGeometry(5, 32, 32);
      let fishMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      for (let i = 0; i < 100; i++) {
        fishMesh = new THREE.Mesh(fishGeometry, fishMaterial);
        fishMesh.position.x = Math.random() * 200 - 100;
        fishMesh.position.y = Math.random() * 200 - 100;
        fishMesh.position.z = Math.random() * 200 - 100;
        scene.add(fishMesh);
        fish.push(fishMesh);
      }

      let ambientLight = new THREE.AmbientLight(0x444444);
      scene.add(ambientLight);

      let pointLight = new THREE.PointLight(0x00ffff, 1, 1000);
      pointLight.position.z = 200;
      scene.add(pointLight);

      let directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
      directionalLight.position.z = 1;
      directionalLight.position.y = 1;
      scene.add(directionalLight);

      for (let i = 0; i < 10; i++) {
        let waveGeometry = new THREE.PlaneGeometry(200, 200);
        let waveMaterial = new THREE.MeshPhongMaterial({ color: 0x0000ff });
        let waveMesh = new THREE.Mesh(waveGeometry, waveMaterial);
        waveMesh.rotation.x = Math.PI / 2;
        waveMesh.position.z = -100 - i * 20;
        scene.add(waveMesh);
        waves.push(waveMesh);
      }

      document.addEventListener('mousedown', onDocumentMouseDown, false);
      document.addEventListener('mouseup', onDocumentMouseUp, false);
      document.addEventListener('mousemove', onDocumentMouseMove, false);
    }

    function onDocumentMouseDown(event) {
      isDragging = true;
      prevX = event.clientX;
      prevY = event.clientY;
    }

    function onDocumentMouseUp(event) {
      isDragging = false;
    }

    function onDocumentMouseMove(event) {
      if (isDragging) {
        rotationX += (event.clientY - prevY) * 0.01;
        rotationY += (event.clientX - prevX) * 0.01;
        camera.position.x = Math.sin(rotationY) * 200;
        camera.position.z = Math.cos(rotationY) * 200;
        camera.position.y = Math.sin(rotationX) * 100;
        camera.lookAt(0, 0, 0);
        prevX = event.clientX;
        prevY = event.clientY;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      mesh.position.y = Math.sin(Date.now() * 0.001) * 10;

      for (let i = 0; i < fish.length; i++) {
        fish[i].position.x += Math.random() * 0.1 - 0.05;
        fish[i].position.y += Math.random() * 0.1 - 0.05;
        fish[i].position.z += Math.random() * 0.1 - 0.05;
      }

      for (let i = 0; i < waves.length; i++) {
        waves[i].position.y = Math.sin(Date.now() * 0.01 + i) * 10;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
