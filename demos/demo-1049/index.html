<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        width: 100vw;
        height: 100vh;
    }
    #title {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #fff;
        font-family: monospace;
        font-size: 18px;
        pointer-events: none;
        user-select: none;
    }
</style>
</head>
<body>
<div id="title">Three.js 3D Demo</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 1, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0x404040, 2.0);
    scene.add(ambient);

    const point1 = new THREE.PointLight(0xffaa33, 1.5);
    point1.position.set(5, 5, 5);
    scene.add(point1);

    const point2 = new THREE.PointLight(0x33aaff, 1.0);
    point2.position.set(-5, -5, -5);
    scene.add(point2);

    // Group that holds everything we want to rotate
    const group = new THREE.Group();
    scene.add(group);

    // Torus Knot
    const torusKnotGeo = new THREE.TorusKnotGeometry(0.7, 0.2, 150, 20);
    const torusKnotMat = new THREE.MeshStandardMaterial({
        color: 0xff0080,
        metalness: 0.8,
        roughness: 0.2,
        emissive: 0x220011,
        emissiveIntensity: 0.5
    });
    const torusKnot = new THREE.Mesh(torusKnotGeo, torusKnotMat);
    group.add(torusKnot);

    // Rotating sphere
    const sphereGeo = new THREE.SphereGeometry(0.4, 32, 32);
    const sphereMat = new THREE.MeshStandardMaterial({
        color: 0x00ffdd,
        metalness: 0.6,
        roughness: 0.1,
        emissive: 0x001111,
        emissiveIntensity: 0.3
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    sphere.position.set(1.5, 0, 0);
    group.add(sphere);

    // Small floating cubes
    const cubeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    for (let i = 0; i < 20; i++) {
        const cubeMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(Math.random(), 0.8, 0.5),
            metalness: 0.5,
            roughness: 0.4
        });
        const cube = new THREE.Mesh(cubeGeo, cubeMat);
        cube.position.set(
            (Math.random() - 0.5) * 4,
            (Math.random() - 0.5) * 4,
            (Math.random() - 0.5) * 4
        );
        group.add(cube);
    }

    // Mouse drag rotation
    let isDragging = false;
    let previousMouse = { x: 0, y: 0 };
    const rotationSpeed = 0.005;

    const onPointerDown = (e) => {
        isDragging = true;
        previousMouse.x = e.clientX;
        previousMouse.y = e.clientY;
    };

    const onPointerMove = (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMouse.x;
        const deltaY = e.clientY - previousMouse.y;
        previousMouse.x = e.clientX;
        previousMouse.y = e.clientY;

        // Rotate around world Y and local X
        group.rotation.y += deltaX * rotationSpeed;
        group.rotation.x += deltaY * rotationSpeed;
    };

    const onPointerUp = () => {
        isDragging = false;
    };

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerup', onPointerUp);
    renderer.domElement.addEventListener('pointerleave', onPointerUp);

    // Resize handling
    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    });

    // Animation loop
    const animate = () => {
        requestAnimationFrame(animate);
        // Slight auto‑rotation when not dragging
        if (!isDragging) {
            group.rotation.y += 0.001;
        }
        renderer.render(scene, camera);
    };
    animate();
})();
</script>
</body>
</html>
