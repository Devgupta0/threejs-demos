<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html,body {
    margin:0;
    padding:0;
    overflow:hidden;
    width:100vw;
    height:100vh;
    background:#000;
    font-family:monospace;
  }
  #title {
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-size:1.2rem;
    pointer-events:none;
    z-index:1;
  }
</style>
</head>
<body>
<div id="title">Three.js 3D Demo</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---- basic setup -------------------------------------------------
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 2, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000);
  document.body.appendChild(renderer.domElement);

  // ---- lights -------------------------------------------------------
  const ambient = new THREE.AmbientLight(0x404040, 1.5);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  // ---- objects ------------------------------------------------------
  const group = new THREE.Group();
  scene.add(group);

  // central torus knot
  const torusGeom = new THREE.TorusKnotGeometry(1, 0.3, 150, 20);
  const torusMat = new THREE.MeshStandardMaterial({
    color: 0x156289,
    emissive: 0x072534,
    metalness: 0.8,
    roughness: 0.2,
    flatShading: true,
  });
  const torus = new THREE.Mesh(torusGeom, torusMat);
  group.add(torus);

  // orbiting spheres
  const sphereGeom = new THREE.SphereGeometry(0.15, 32, 32);
  const colors = [0xff5555, 0x55ff55, 0x5555ff, 0xffff55, 0xff55ff];
  const sphereCount = 8;
  for (let i = 0; i < sphereCount; i++) {
    const mat = new THREE.MeshStandardMaterial({
      color: colors[i % colors.length],
      metalness: 0.6,
      roughness: 0.3,
    });
    const sphere = new THREE.Mesh(sphereGeom, mat);
    const angle = (i / sphereCount) * Math.PI * 2;
    const radius = 2.5;
    sphere.position.set(
      Math.cos(angle) * radius,
      Math.sin(angle) * radius * 0.4,
      Math.sin(angle) * radius
    );
    group.add(sphere);
  }

  // ---- mouse drag rotation -----------------------------------------
  let isDragging = false;
  let previousMouse = { x: 0, y: 0 };
  const rotateSpeed = 0.005;

  const onPointerDown = (e) => {
    isDragging = true;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
  };
  const onPointerMove = (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMouse.x;
    const deltaY = e.clientY - previousMouse.y;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;

    group.rotation.y += deltaX * rotateSpeed;
    group.rotation.x += deltaY * rotateSpeed;
    group.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, group.rotation.x));
  };
  const onPointerUp = () => { isDragging = false; };

  renderer.domElement.addEventListener('mousedown', onPointerDown);
  renderer.domElement.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  // Touch support
  renderer.domElement.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      onPointerDown(e.touches[0]);
    }
  }, {passive:true});
  renderer.domElement.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) {
      onPointerMove(e.touches[0]);
    }
  }, {passive:true});
  window.addEventListener('touchend', onPointerUp);

  // ---- animation loop ------------------------------------------------
  const clock = new THREE.Clock();

  const animate = () => {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    // slow auto‑spin when not dragging
    if (!isDragging) {
      group.rotation.y += delta * 0.2;
    }

    // subtle torus knot rotation
    torus.rotation.x += delta * 0.5;
    torus.rotation.y += delta * 0.3;

    renderer.render(scene, camera);
  };
  animate();

  // ---- resize handling -----------------------------------------------
  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();
</script>
</body>
</html>
