<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; }
  #title {
    position:absolute;
    top:10px; left:10px;
    color:#fff;
    font-family:monospace;
    font-size:1.2rem;
    pointer-events:none;
    z-index:1;
  }
</style>
</head>
<body>
<div id="title">Three.js Demo</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 6);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0x404040, 1.5);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(5, 10, 7);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const pointLight = new THREE.PointLight(0xffaa33, 1.2, 100);
  pointLight.position.set(-5, 5, -5);
  scene.add(pointLight);

  // Objects container
  const group = new THREE.Group();
  scene.add(group);

  // Torus Knot
  const torusGeom = new THREE.TorusKnotGeometry(1, 0.3, 150, 20);
  const torusMat = new THREE.MeshStandardMaterial({
    color: 0x156289,
    emissive: 0x072534,
    metalness: 0.7,
    roughness: 0.2,
    wireframe: false
  });
  const torus = new THREE.Mesh(torusGeom, torusMat);
  torus.castShadow = true;
  group.add(torus);

  // Rotating sphere
  const sphereGeom = new THREE.SphereGeometry(0.6, 32, 32);
  const sphereMat = new THREE.MeshStandardMaterial({
    color: 0xff5533,
    metalness: 0.5,
    roughness: 0.4
  });
  const sphere = new THREE.Mesh(sphereGeom, sphereMat);
  sphere.position.set(2.5, 0, 0);
  sphere.castShadow = true;
  group.add(sphere);

  // Small floating cubes
  for (let i = 0; i < 30; i++) {
    const size = Math.random() * 0.2 + 0.05;
    const cubeGeom = new THREE.BoxGeometry(size, size, size);
    const cubeMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
      metalness: 0.3,
      roughness: 0.6
    });
    const cube = new THREE.Mesh(cubeGeom, cubeMat);
    cube.position.set(
      (Math.random() - 0.5) * 6,
      (Math.random() - 0.5) * 4,
      (Math.random() - 0.5) * 6
    );
    cube.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    group.add(cube);
  }

  // Ground plane
  const planeGeom = new THREE.PlaneGeometry(50, 50);
  const planeMat = new THREE.MeshStandardMaterial({ color: 0x111111, side: THREE.DoubleSide });
  const plane = new THREE.Mesh(planeGeom, planeMat);
  plane.rotation.x = -Math.PI/2;
  plane.position.y = -1.5;
  plane.receiveShadow = true;
  scene.add(plane);

  // Mouse drag rotation
  let isDragging = false;
  let previousMouse = { x: 0, y: 0 };
  const rotationSpeed = 0.005;

  function onPointerDown(event) {
    isDragging = true;
    previousMouse.x = event.clientX;
    previousMouse.y = event.clientY;
  }

  function onPointerMove(event) {
    if (!isDragging) return;
    const deltaX = event.clientX - previousMouse.x;
    const deltaY = event.clientY - previousMouse.y;
    previousMouse.x = event.clientX;
    previousMouse.y = event.clientY;

    group.rotation.y += deltaX * rotationSpeed;
    group.rotation.x += deltaY * rotationSpeed;
    // Clamp X rotation to avoid flipping
    group.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, group.rotation.x));
  }

  function onPointerUp() {
    isDragging = false;
  }

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
  renderer.domElement.addEventListener('pointerleave', onPointerUp);

  // Resize handling
  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    // subtle auto-rotation
    group.rotation.y += 0.001;
    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
