<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater Dreamscape</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            font-family: monospace;
        }
        #title {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="title">Underwater Dreamscape</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, mesh, fish, shipwreck, seaweed, coral;
        let drag = false, prevX, prevY;
        let fishCount = 100;
        let seaweedCount = 50;
        let coralCount = 20;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 10;

            renderer = new THREE.WebGLRenderer({
                canvas: document.createElement('canvas'),
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            let geometry = new THREE.PlaneGeometry(100, 100);
            let material = new THREE.MeshBasicMaterial({ color: 0x0000ff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = Math.PI / 2;
            scene.add(mesh);

            for (let i = 0; i < fishCount; i++) {
                geometry = new THREE.SphereGeometry(0.1, 16, 16);
                material = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                fish = new THREE.Mesh(geometry, material);
                fish.position.x = Math.random() * 10 - 5;
                fish.position.y = Math.random() * 10 - 5;
                fish.position.z = Math.random() * 10 - 5;
                scene.add(fish);
            }

            geometry = new THREE.BoxGeometry(5, 5, 5);
            material = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            shipwreck = new THREE.Mesh(geometry, material);
            shipwreck.position.y = -2;
            scene.add(shipwreck);

            for (let i = 0; i < seaweedCount; i++) {
                geometry = new THREE.CylinderGeometry(0.1, 0.1, 2, 16);
                material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                seaweed = new THREE.Mesh(geometry, material);
                seaweed.position.x = Math.random() * 10 - 5;
                seaweed.position.y = Math.random() * 10 - 5;
                seaweed.position.z = Math.random() * 10 - 5;
                scene.add(seaweed);
            }

            for (let i = 0; i < coralCount; i++) {
                geometry = new THREE.SphereGeometry(0.5, 16, 16);
                material = new THREE.MeshBasicMaterial({ color: 0xff00ff });
                coral = new THREE.Mesh(geometry, material);
                coral.position.x = Math.random() * 10 - 5;
                coral.position.y = Math.random() * 10 - 5;
                coral.position.z = Math.random() * 10 - 5;
                scene.add(coral);
            }

            let ambientLight = new THREE.AmbientLight(0x444444);
            scene.add(ambientLight);

            let pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);

            document.addEventListener('mousedown', (e) => {
                drag = true;
                prevX = e.clientX;
                prevY = e.clientY;
            });

            document.addEventListener('mousemove', (e) => {
                if (drag) {
                    camera.rotation.x += (e.clientY - prevY) * 0.01;
                    camera.rotation.y += (e.clientX - prevX) * 0.01;
                    prevX = e.clientX;
                    prevY = e.clientY;
                }
            });

            document.addEventListener('mouseup', () => {
                drag = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            mesh.position.y = Math.sin(Date.now() * 0.01) * 2;

            for (let i = 0; i < scene.children.length; i++) {
                if (scene.children[i].type === 'Mesh' && scene.children[i].geometry.type === 'SphereGeometry' && scene.children[i].material.color.getHex() === 0x00ffff) {
                    scene.children[i].position.x += Math.random() * 0.01 - 0.005;
                    scene.children[i].position.y += Math.random() * 0.01 - 0.005;
                    scene.children[i].position.z += Math.random() * 0.01 - 0.005;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
