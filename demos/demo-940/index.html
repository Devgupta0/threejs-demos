```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Abandoned Underwater Facility</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
    }
    #title {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: monospace;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="title">Abandoned Underwater Facility</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, fish, facility;
    let rotX = 0, rotY = 0;
    let mouseDown = false, lastX, lastY;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const facilityGeometry = new THREE.BoxGeometry(2, 2, 2);
      const facilityMaterial = new THREE.MeshPhongMaterial({
        color: 0x444444,
        specular: 0x333333,
        shininess: 10
      });
      facility = new THREE.Mesh(facilityGeometry, facilityMaterial);
      facility.position.z = -2;
      scene.add(facility);

      const fishGeometry = new THREE.SphereGeometry(0.1, 16, 16);
      const fishMaterial = new THREE.MeshPhongMaterial({
        color: 0x66cccc,
        transparent: true,
        opacity: 0.5,
        specular: 0xffffff,
        shininess: 100
      });
      for (let i = 0; i < 100; i++) {
        fish = new THREE.Mesh(fishGeometry, fishMaterial);
        fish.position.x = Math.random() * 4 - 2;
        fish.position.y = Math.random() * 4 - 2;
        fish.position.z = Math.random() * 4 - 2;
        scene.add(fish);
      }

      const light1 = new THREE.PointLight(0x00ff00, 1, 10);
      light1.position.x = 2;
      light1.position.y = 2;
      light1.position.z = 2;
      scene.add(light1);

      const light2 = new THREE.PointLight(0x0000ff, 1, 10);
      light2.position.x = -2;
      light2.position.y = -2;
      light2.position.z = -2;
      scene.add(light2);

      const ambientLight = new THREE.AmbientLight(0x111111);
      scene.add(ambientLight);

      document.addEventListener('mousedown', onDocumentMouseDown, false);
      document.addEventListener('mouseup', onDocumentMouseUp, false);
      document.addEventListener('mousemove', onDocumentMouseMove, false);
    }

    function animate() {
      requestAnimationFrame(animate);
      facility.rotation.x += 0.001;
      facility.rotation.y += 0.001;
      renderer.render(scene, camera);
    }

    function onDocumentMouseDown(event) {
      mouseDown = true;
      lastX = event.clientX;
      lastY = event.clientY;
    }

    function onDocumentMouseUp(event) {
      mouseDown = false;
    }

    function onDocumentMouseMove(event) {
      if (mouseDown) {
        rotX += (event.clientY - lastY) * 0.01;
        rotY += (event.clientX - lastX) * 0.01;
        camera.position.x = 5 * Math.sin(rotY) * Math.cos(rotX);
        camera.position.y = 5 * Math.sin(rotX);
        camera.position.z = 5 * Math.cos(rotY) * Math.cos(rotX);
        camera.lookAt(new THREE.Vector3(0, 0, 0));
        lastX = event.clientX;
        lastY = event.clientY;
      }
    }
  </script>
</body>
</html>
