<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    html, body { margin:0; padding:0; overflow:hidden; height:100%; background:#000; }
    #title {
        position:absolute;
        top:10px; left:10px;
        color:#fff;
        font-family:monospace;
        font-size:18px;
        pointer-events:none;
        z-index:1;
    }
    canvas { display:block; }
</style>
</head>
<body>
<div id="title">Three.js Impressive Scene</div>
<script>
    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    // Scene & Camera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);
    camera.lookAt(0, 0, 0);

    // Group to rotate with mouse
    const world = new THREE.Group();
    scene.add(world);

    // Lights
    const ambient = new THREE.AmbientLight(0x404040, 1.5);
    scene.add(ambient);

    const directional = new THREE.DirectionalLight(0xffffff, 1.2);
    directional.position.set(5, 10, 7);
    scene.add(directional);

    const point1 = new THREE.PointLight(0xffaa33, 1.0, 50);
    point1.position.set(-4, 3, 2);
    scene.add(point1);

    const point2 = new THREE.PointLight(0x33aaff, 1.0, 50);
    point2.position.set(4, -2, -3);
    scene.add(point2);

    // Objects
    // Torus Knot
    const torusGeo = new THREE.TorusKnotGeometry(1, 0.3, 150, 20);
    const torusMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, metalness: 0.7, roughness: 0.2 });
    const torus = new THREE.Mesh(torusGeo, torusMat);
    torus.castShadow = true;
    world.add(torus);

    // Rotating Cube Cluster
    const cubeGroup = new THREE.Group();
    for (let i = 0; i < 12; i++) {
        const size = 0.4 + Math.random() * 0.3;
        const cubeGeo = new THREE.BoxGeometry(size, size, size);
        const cubeMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(`hsl(${Math.random() * 360},80%,60%)`),
            metalness: 0.5,
            roughness: 0.4
        });
        const cube = new THREE.Mesh(cubeGeo, cubeMat);
        const radius = 2.5;
        const angle = (i / 12) * Math.PI * 2;
        cube.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 1.5, Math.sin(angle) * radius);
        cubeGroup.add(cube);
    }
    world.add(cubeGroup);

    // Floating sphere
    const sphereGeo = new THREE.SphereGeometry(0.8, 32, 32);
    const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0x220022, metalness: 0.3, roughness: 0.6 });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    sphere.position.set(-2, 1.5, -1);
    world.add(sphere);

    // Simple ground plane
    const planeGeo = new THREE.PlaneGeometry(30, 30);
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x111111, side: THREE.DoubleSide });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = -2;
    scene.add(plane);

    // Mouse control variables
    let isDragging = false;
    let previousMouse = { x: 0, y: 0 };
    const rotationSpeed = 0.005;

    function onPointerDown(event) {
        isDragging = true;
        previousMouse.x = event.clientX;
        previousMouse.y = event.clientY;
    }

    function onPointerMove(event) {
        if (!isDragging) return;
        const deltaX = event.clientX - previousMouse.x;
        const deltaY = event.clientY - previousMouse.y;
        world.rotation.y += deltaX * rotationSpeed;
        world.rotation.x += deltaY * rotationSpeed;
        previousMouse.x = event.clientX;
        previousMouse.y = event.clientY;
    }

    function onPointerUp() {
        isDragging = false;
    }

    // Touch support
    function onTouchStart(e) {
        if (e.touches.length === 1) {
            const touch = e.touches[0];
            onPointerDown(touch);
        }
    }
    function onTouchMove(e) {
        if (e.touches.length === 1) {
            const touch = e.touches[0];
            onPointerMove(touch);
        }
    }
    function onTouchEnd() {
        onPointerUp();
    }

    // Event listeners
    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerup', onPointerUp);
    renderer.domElement.addEventListener('pointerleave', onPointerUp);

    renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
    renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
    renderer.domElement.addEventListener('touchend', onTouchEnd);
    renderer.domElement.addEventListener('touchcancel', onTouchEnd);

    // Resize handling
    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    });

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);
        torus.rotation.x += 0.01;
        torus.rotation.y += 0.015;
        cubeGroup.rotation.y += 0.008;
        sphere.position.y = 1.5 + Math.sin(Date.now() * 0.002) * 0.3;
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
