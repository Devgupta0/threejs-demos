<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
html,body{
    margin:0;
    overflow:hidden;
    height:100%;
    background:#000;
}
#sceneTitle{
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-family:monospace;
    font-size:18px;
    pointer-events:none;
}
canvas{display:block;}
</style>
</head>
<body>
<div id="sceneTitle">My 3D Scene</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer, group;
let isDragging = false, prevPos = {x:0,y:0};

init();
animate();

function init(){
    // Renderer
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    // Scene & Camera
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0,2,5);

    // Group for rotation
    group = new THREE.Group();
    scene.add(group);

    // Objects
    addObjects();

    // Lights
    const amb = new THREE.AmbientLight(0x404040, 1.5);
    scene.add(amb);
    const dir = new THREE.DirectionalLight(0xffffff, 2);
    dir.position.set(5,10,7);
    scene.add(dir);

    // Resize handling
    window.addEventListener('resize', onResize);

    // Simple mouse drag rotate
    const canvas = renderer.domElement;
    canvas.addEventListener('mousedown', e=>{isDragging=true; prevPos={x:e.clientX,y:e.clientY};});
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mouseup',()=>{isDragging=false;});
    canvas.addEventListener('mouseleave',()=>{isDragging=false;});
}

function addObjects(){
    // Torus Knot
    const tkGeo = new THREE.TorusKnotGeometry(0.8,0.2,150,20);
    const tkMat = new THREE.MeshStandardMaterial({color:0xff3366, metalness:0.6, roughness:0.2});
    const torus = new THREE.Mesh(tkGeo, tkMat);
    torus.position.y = 0.5;
    group.add(torus);

    // Emissive Sphere
    const sphGeo = new THREE.SphereGeometry(0.4,32,32);
    const sphMat = new THREE.MeshStandardMaterial({
        color:0x33aaff,
        emissive:0x112244,
        metalness:0.3,
        roughness:0.4
    });
    const sphere = new THREE.Mesh(sphGeo, sphMat);
    sphere.position.set(-1.5,0,0);
    group.add(sphere);

    // Floor Plane
    const plGeo = new THREE.PlaneGeometry(20,20);
    const plMat = new THREE.MeshStandardMaterial({color:0x222222, side:THREE.DoubleSide});
    const plane = new THREE.Mesh(plGeo, plMat);
    plane.rotation.x = -Math.PI/2;
    plane.position.y = -0.5;
    scene.add(plane);
}

function onResize(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function onMouseMove(e){
    if(!isDragging) return;

        x: e.clientX - prevPos.x,
        y: e.clientY - prevPos.y
    };
