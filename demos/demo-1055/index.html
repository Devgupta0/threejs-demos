<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; height:100%; background:#000; }
  canvas { display:block; }
  #title {
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-family:monospace;
    font-size:16px;
    pointer-events:none;
    user-select:none;
  }
</style>
</head>
<body>
<div id="title">Three.js Demo</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.5, 4);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000);
  document.body.appendChild(renderer.domElement);

  // Group to hold all objects (so we can rotate it)
  const world = new THREE.Group();
  scene.add(world);

  // Lights
  const ambient = new THREE.AmbientLight(0x404040, 1.5);
  scene.add(ambient);

  const directional = new THREE.DirectionalLight(0xffffff, 1.2);
  directional.position.set(5, 10, 7);
  scene.add(directional);

  const point = new THREE.PointLight(0xffaa33, 2, 30);
  point.position.set(-3, 2, 2);
  scene.add(point);

  // Objects
  const torusKnot = new THREE.Mesh(
    new THREE.TorusKnotGeometry(0.8, 0.25, 150, 20),
    new THREE.MeshStandardMaterial({ color: 0x156289, metalness: 0.6, roughness: 0.2, emissive: 0x072534 })
  );
  world.add(torusKnot);

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0xf54291, metalness: 0.3, roughness: 0.7 })
  );
  sphere.position.set(2, 0.5, -1);
  world.add(sphere);

  const box = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.5, 0.5),
    new THREE.MeshStandardMaterial({ color: 0x42f554, metalness: 0.4, roughness: 0.5 })
  );
  box.position.set(-1.5, -0.2, 1);
  world.add(box);

  // Ground plane (just for visual reference)
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide })
  );
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -1;
  scene.add(plane);

  // Mouse drag rotation
  let isDragging = false;
  let previousMouse = { x: 0, y: 0 };
  const rotationSpeed = 0.005;

  const onPointerDown = (e) => {
    isDragging = true;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
  };
  const onPointerMove = (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMouse.x;
    const deltaY = e.clientY - previousMouse.y;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;

    world.rotation.y += deltaX * rotationSpeed;
    world.rotation.x += deltaY * rotationSpeed;
    world.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, world.rotation.x));
  };
  const onPointerUp = () => { isDragging = false; };

  renderer.domElement.addEventListener('mousedown', onPointerDown);
  renderer.domElement.addEventListener('mousemove', onPointerMove);
  renderer.domElement.addEventListener('mouseup', onPointerUp);
  renderer.domElement.addEventListener('mouseleave', onPointerUp);
  // Touch support
  renderer.domElement.addEventListener('touchstart', (e) => { onPointerDown(e.touches[0]); });
  renderer.domElement.addEventListener('touchmove', (e) => { onPointerMove(e.touches[0]); });
  renderer.domElement.addEventListener('touchend', onPointerUp);

  // Auto‑rotate a bit for visual interest
  const autoRotateSpeed = 0.001;

  function animate() {
    requestAnimationFrame(animate);
    world.rotation.y += autoRotateSpeed;
    renderer.render(scene, camera);
  }
  animate();

  // Resize handling
  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });
})();
</script>
</body>
</html>
