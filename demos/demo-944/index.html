```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater World</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            font-family: monospace;
        }
        #title {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="title">Underwater World</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, jellyfish, fish, title;
        let mouseX = 0, mouseY = 0;
        let dragX = 0, dragY = 0;
        let isDragging = false;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({
                canvas: document.createElement('canvas'),
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x111111);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(0, 0, 5);
            scene.add(pointLight);

            jellyfish = new THREE.Mesh(
                new THREE.SphereGeometry(1, 32, 32),
                new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.5
                })
            );
            jellyfish.position.set(0, 0, 0);
            scene.add(jellyfish);

            fish = [];
            for (let i = 0; i < 100; i++) {
                const fishGeometry = new THREE.SphereGeometry(0.1, 16, 16);
                const fishMaterial = new THREE.MeshBasicMaterial({
                    color: new THREE.Color(`hsl(${Math.random() * 360}, 100%, 50%)`)
                });
                const fishMesh = new THREE.Mesh(fishGeometry, fishMaterial);
                fishMesh.position.set(
                    Math.random() * 2 - 1,
                    Math.random() * 2 - 1,
                    Math.random() * 2 - 1
                );
                scene.add(fishMesh);
                fish.push(fishMesh);
            }

            title = document.getElementById('title');

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('touchmove', onTouchMove);
            document.addEventListener('touchstart', onTouchStart);
            document.addEventListener('touchend', onTouchEnd);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            jellyfish.rotation.x += 0.01;
            jellyfish.rotation.y += 0.01;

            for (let i = 0; i < fish.length; i++) {
                fish[i].position.x += Math.random() * 0.01 - 0.005;
                fish[i].position.y += Math.random() * 0.01 - 0.005;
                fish[i].position.z += Math.random() * 0.01 - 0.005;
            }

            camera.rotation.x += (dragY - camera.rotation.x) * 0.05;
            camera.rotation.y += (dragX - camera.rotation.y) * 0.05;

            renderer.render(scene, camera);
        }

        function onMouseMove(event) {
            if (isDragging) {
                dragX += event.movementX * 0.01;
                dragY += event.movementY * 0.01;
            }
        }

        function onMouseDown(event) {
            isDragging = true;
        }

        function onMouseUp(event) {
            isDragging = false;
        }

        function onTouchMove(event) {
            if (isDragging) {
                dragX += event.touches[0].clientX * 0.01;
                dragY += event.touches[0].clientY * 0.01;
            }
        }

        function onTouchStart(event) {
            isDragging = true;
        }

        function onTouchEnd(event) {
            isDragging = false;
        }

        init();
    </script>
</body>
</html>
