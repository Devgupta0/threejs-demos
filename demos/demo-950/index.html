```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater City</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            font-family: monospace;
        }
        #title {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="title">Underwater City</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, fish, jellyfish, oceanFloor;
        let mouseDown = false, previousMousePosition = null;
        let rotationSpeed = 0.01;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({
                canvas: document.createElement('canvas'),
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geometry = new THREE.SphereGeometry(0.1, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            fish = [];
            for (let i = 0; i < 100; i++) {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.x = Math.random() * 10 - 5;
                mesh.position.y = Math.random() * 10 - 5;
                mesh.position.z = Math.random() * 10 - 5;
                scene.add(mesh);
                fish.push(mesh);
            }

            const jellyfishGeometry = new THREE.SphereGeometry(1, 32, 32);
            const jellyfishMaterial = new THREE.MeshBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.5 });
            jellyfish = new THREE.Mesh(jellyfishGeometry, jellyfishMaterial);
            scene.add(jellyfish);

            const oceanFloorGeometry = new THREE.PlaneGeometry(100, 100);
            const oceanFloorMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });
            oceanFloor = new THREE.Mesh(oceanFloorGeometry, oceanFloorMaterial);
            oceanFloor.position.y = -10;
            oceanFloor.rotation.x = Math.PI / 2;
            scene.add(oceanFloor);

            const ambientLight = new THREE.AmbientLight(0x444444);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.z = 5;
            scene.add(pointLight);

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousedown', onDocumentMouseDown, false);
            window.addEventListener('mouseup', onDocumentMouseUp, false);
            window.addEventListener('mousemove', onDocumentMouseMove, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentMouseDown(event) {
            event.preventDefault();
            mouseDown = true;
            previousMousePosition = {
                x: event.clientX,
                y: event.clientY
            };
        }

        function onDocumentMouseUp() {
            mouseDown = false;
            previousMousePosition = null;
        }

        function onDocumentMouseMove(event) {
            if (mouseDown) {
                const deltaMousePosition = {
                    x: event.clientX - previousMousePosition.x,
                    y: event.clientY - previousMousePosition.y
                };
                camera.rotation.x += deltaMousePosition.y * rotationSpeed;
                camera.rotation.y += deltaMousePosition.x * rotationSpeed;
                previousMousePosition = {
                    x: event.clientX,
                    y: event.clientY
                };
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            fish.forEach((mesh, index) => {
                mesh.position.x += Math.random() * 0.01 - 0.005;
                mesh.position.y += Math.random() * 0.01 - 0.005;
                mesh.position.z += Math.random() * 0.01 - 0.005;
            });

            jellyfish.position.y = Math.sin(Date.now() * 0.001) * 0.1;
            jellyfish.scale.x = 1 + Math.sin(Date.now() * 0.001) * 0.1;
            jellyfish.scale.y = 1 + Math.sin(Date.now() * 0.001) * 0.1;
            jellyfish.scale.z = 1 + Math.sin(Date.now() * 0.001) * 0.1;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
