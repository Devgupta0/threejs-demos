<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html, body {
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000;
  }
  #title {
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-family:monospace;
    font-size:18px;
    pointer-events:none;
    z-index:1;
  }
  canvas { display:block; }
</style>
</head>
<body>
<div id="title">Three.js 3D Scene</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // Scene, Camera, Renderer
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 5);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0x404040, 1.5);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);
  const pointLight = new THREE.PointLight(0xffaa33, 0.8);
  pointLight.position.set(-4, 4, -4);
  scene.add(pointLight);

  // Group that will be rotated by mouse
  const group = new THREE.Group();
  scene.add(group);

  // Objects
  const geometry1 = new THREE.TorusKnotGeometry(0.8, 0.3, 150, 20);
  const material1 = new THREE.MeshStandardMaterial({ color: 0x156289, emissive: 0x072534, metalness: 0.7, roughness: 0.2 });
  const torusKnot = new THREE.Mesh(geometry1, material1);
  group.add(torusKnot);

  const geometry2 = new THREE.SphereGeometry(0.5, 32, 32);
  const material2 = new THREE.MeshStandardMaterial({ color: 0xe91e63, metalness: 0.5, roughness: 0.4 });
  const sphere = new THREE.Mesh(geometry2, material2);
  sphere.position.set(1.8, 0, 0);
  group.add(sphere);

  const geometry3 = new THREE.BoxGeometry(0.6, 0.6, 0.6);
  const material3 = new THREE.MeshStandardMaterial({ color: 0xffc107, metalness: 0.3, roughness: 0.6 });
  const cube = new THREE.Mesh(geometry3, material3);
  cube.position.set(-1.8, 0, 0);
  group.add(cube);

  // Floor
  const floorGeo = new THREE.PlaneGeometry(20, 20);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -1.2;
  scene.add(floor);

  // Mouse drag rotation
  let isDragging = false;
  let previousMouse = { x: 0, y: 0 };
  const rotateSpeed = 0.005;

  const onPointerDown = (e) => {
    isDragging = true;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
  };
  const onPointerMove = (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMouse.x;
    const deltaY = e.clientY - previousMouse.y;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;

    // Rotate around world Y for horizontal drag
    group.rotation.y += deltaX * rotateSpeed;
    // Rotate around camera's local X axis for vertical drag
    group.rotation.x += deltaY * rotateSpeed;
    // Clamp vertical rotation to avoid flipping
    const limit = Math.PI / 2 - 0.1;
    group.rotation.x = Math.max(-limit, Math.min(limit, group.rotation.x));
  };
  const onPointerUp = () => {
    isDragging = false;
  };

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointerleave', onPointerUp);

  // Resize handling
  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  // Animation loop
  const clock = new THREE.Clock();
  const animate = () => {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    // Slow auto-rotate for extra dynamism
    group.rotation.y += delta * 0.2;

    renderer.render(scene, camera);
  };
  animate();
})();
</script>
</body>
</html>
