<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; }
  #sceneTitle {
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-family:monospace;
    font-size:18px;
    pointer-events:none;
    user-select:none;
  }
</style>
</head>
<body>
<div id="sceneTitle">Three.js Demo</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ==== Core setup ====
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  // camera positioned a bit back looking at origin
  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 2, 8);
  camera.lookAt(0, 0, 0);

  // ==== Lights ====
  const ambient = new THREE.AmbientLight(0x404040, 2.0); // soft white
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  const pointLight = new THREE.PointLight(0xffaa33, 1.2, 100);
  pointLight.position.set(-5, 5, -5);
  scene.add(pointLight);

  // ==== Objects (inside a group for easy rotation) ====
  const group = new THREE.Group();
  scene.add(group);

  // Torus Knot
  const knotGeo = new THREE.TorusKnotGeometry(1, 0.3, 150, 20);
  const knotMat = new THREE.MeshStandardMaterial({
    color: 0x156289,
    emissive: 0x072534,
    metalness: 0.7,
    roughness: 0.2,
    wireframe: false
  });
  const knot = new THREE.Mesh(knotGeo, knotMat);
  group.add(knot);

  // Rotating sphere
  const sphereGeo = new THREE.SphereGeometry(0.6, 32, 32);
  const sphereMat = new THREE.MeshStandardMaterial({
    color: 0xff5533,
    emissive: 0x331100,
    metalness: 0.4,
    roughness: 0.6
  });
  const sphere = new THREE.Mesh(sphereGeo, sphereMat);
  sphere.position.set(2.5, 0, 0);
  group.add(sphere);

  // Ground plane
  const planeGeo = new THREE.PlaneGeometry(20, 20);
  const planeMat = new THREE.MeshStandardMaterial({
    color: 0x222222,
    side: THREE.DoubleSide
  });
  const plane = new THREE.Mesh(planeGeo, planeMat);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -1.5;
  group.add(plane);

  // ==== Mouse drag to rotate group ====
  let isDragging = false;
  let previousMouse = { x: 0, y: 0 };
  const rotationSpeed = 0.005;

  function onPointerDown(event) {
    isDragging = true;
    previousMouse.x = event.clientX;
    previousMouse.y = event.clientY;
  }

  function onPointerMove(event) {
    if (!isDragging) return;
    const deltaX = event.clientX - previousMouse.x;
    const deltaY = event.clientY - previousMouse.y;
    previousMouse.x = event.clientX;
    previousMouse.y = event.clientY;

    // rotate around Y axis (horizontal drag)
    group.rotation.y += deltaX * rotationSpeed;
    // rotate around X axis (vertical drag) with limits
    const newX = group.rotation.x + deltaY * rotationSpeed;
    group.rotation.x = THREE.MathUtils.clamp(newX, -Math.PI / 2, Math.PI / 2);
  }

  function onPointerUp() {
    isDragging = false;
  }

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
  renderer.domElement.addEventListener('pointerleave', onPointerUp);

  // ==== Resize handling ====
  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  // ==== Animation loop ====
  function animate() {
    requestAnimationFrame(animate);
    // subtle automatic spin
    group.rotation.y += 0.001;
    group.rotation.x += 0.0005;
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
