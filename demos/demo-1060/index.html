<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
    html, body {
        margin:0;
        padding:0;
        overflow:hidden;
        width:100vw;
        height:100vh;
        background:#000;
        font-family:monospace;
    }
    canvas { display:block; }
    #title {
        position:absolute;
        top:10px;
        left:10px;
        color:#fff;
        font-size:18px;
        pointer-events:none;
        user-select:none;
    }
</style>
</head>
<body>
<div id="title">My Awesome 3D Scene</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 2, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    // ---------- Lights ----------
    const ambient = new THREE.AmbientLight(0x404040, 1.5);
    scene.add(ambient);

    const pointLight = new THREE.PointLight(0xffffff, 2, 100);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    const pointLight2 = new THREE.PointLight(0xffaa88, 1.5, 100);
    pointLight2.position.set(-5, -3, -4);
    scene.add(pointLight2);

    // ---------- Objects ----------
    const group = new THREE.Group();
    scene.add(group);

    // Central rotating torus knot
    const geometry = new THREE.TorusKnotGeometry(1, 0.35, 150, 20);
    const material = new THREE.MeshStandardMaterial({
        color: 0x2194ce,
        metalness: 0.7,
        roughness: 0.2,
        emissive: 0x072534,
        emissiveIntensity: 0.5
    });
    const torusKnot = new THREE.Mesh(geometry, material);
    group.add(torusKnot);

    // Surrounding floating spheres
    const sphereGeo = new THREE.SphereGeometry(0.15, 16, 16);
    for (let i = 0; i < 30; i++) {
        const mat = new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
            metalness: 0.5,
            roughness: 0.4
        });
        const sphere = new THREE.Mesh(sphereGeo, mat);
        const phi = Math.acos(2 * Math.random() - 1);
        const theta = 2 * Math.PI * Math.random();
        const radius = 3 + Math.random() * 2;
        sphere.position.setFromSphericalCoords(radius, phi, theta);
        group.add(sphere);
    }

    // ---------- Mouse Drag Controls ----------
    let isDragging = false;
    let previousMouse = { x: 0, y: 0 };
    const rotationSpeed = 0.005;

    const onPointerDown = (e) => {
        isDragging = true;
        previousMouse.x = e.clientX;
        previousMouse.y = e.clientY;
    };
    const onPointerMove = (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMouse.x;
        const deltaY = e.clientY - previousMouse.y;
        previousMouse.x = e.clientX;
        previousMouse.y = e.clientY;

        // Rotate the group based on mouse movement
        group.rotation.y += deltaX * rotationSpeed;
        group.rotation.x += deltaY * rotationSpeed;
        // Clamp vertical rotation to avoid flipping
        group.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, group.rotation.x));
    };
    const onPointerUp = () => { isDragging = false; };

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointerleave', onPointerUp);

    // ---------- Resize ----------
    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    });

    // ---------- Animation ----------
    const animate = () => {
        requestAnimationFrame(animate);
        // Slow automatic spin
        group.rotation.y += 0.001;
        // Slight up‑down bobbing of the torus knot
        torusKnot.position.y = Math.sin(Date.now() * 0.001) * 0.1;
        renderer.render(scene, camera);
    };
    animate();
})();
</script>
</body>
</html>
