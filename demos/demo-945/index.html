<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Aurora Research Station</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
    }
    #title {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: monospace;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="title">Aurora Research Station</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, canvas;
    let rotationX = 0, rotationY = 0;
    let mouseDown = false, mouseX = 0, mouseY = 0;

    init();
    animate();

    function init() {
      canvas = document.createElement('canvas');
      document.body.appendChild(canvas);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      let ambientLight = new THREE.AmbientLight(0x444444);
      scene.add(ambientLight);

      let pointLight = new THREE.PointLight(0x888888, 1, 100);
      pointLight.position.set(0, 0, 5);
      scene.add(pointLight);

      let researchStation = new THREE.Mesh(
        new THREE.BoxGeometry(2, 2, 2),
        new THREE.MeshPhongMaterial({ color: 0x222222 })
      );
      scene.add(researchStation);

      let aurora = new THREE.Mesh(
        new THREE.SphereGeometry(10, 60, 60),
        new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.5
        })
      );
      aurora.position.set(0, 0, -10);
      scene.add(aurora);

      let blueprints = [];
      for (let i = 0; i < 10; i++) {
        let blueprint = new THREE.Mesh(
          new THREE.PlaneGeometry(0.5, 0.5),
          new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.5
          })
        );
        blueprint.position.set(Math.random() * 4 - 2, Math.random() * 4 - 2, Math.random() * 4 - 2);
        blueprint.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        scene.add(blueprint);
        blueprints.push(blueprint);
      }

      let holographicConsoles = [];
      for (let i = 0; i < 10; i++) {
        let console = new THREE.Mesh(
          new THREE.PlaneGeometry(0.2, 0.2),
          new THREE.MeshBasicMaterial({
            color: 0xff0000,
            transparent: true,
            opacity: 0.5
          })
        );
        console.position.set(Math.random() * 4 - 2, Math.random() * 4 - 2, Math.random() * 4 - 2);
        console.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        scene.add(console);
        holographicConsoles.push(console);
      }

      document.addEventListener('mousedown', onMouseDown);
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    }

    function animate() {
      requestAnimationFrame(animate);

      let time = Date.now() * 0.001;
      let aurora = scene.children[2];
      aurora.scale.set(1 + Math.sin(time) * 0.1, 1 + Math.sin(time) * 0.1, 1 + Math.sin(time) * 0.1);
      aurora.rotation.set(time, time, time);

      let blueprints = scene.children.slice(3, 13);
      for (let i = 0; i < blueprints.length; i++) {
        blueprints[i].rotation.set(blueprints[i].rotation.x + 0.01, blueprints[i].rotation.y + 0.01, blueprints[i].rotation.z + 0.01);
      }

      let holographicConsoles = scene.children.slice(13);
      for (let i = 0; i < holographicConsoles.length; i++) {
        holographicConsoles[i].rotation.set(holographicConsoles[i].rotation.x + 0.01, holographicConsoles[i].rotation.y + 0.01, holographicConsoles[i].rotation.z + 0.01);
      }

      camera.rotation.set(rotationX, rotationY, 0);

      renderer.render(scene, camera);
    }

    function onMouseDown(event) {
      mouseDown = true;
      mouseX = event.clientX;
      mouseY = event.clientY;
    }

    function onMouseMove(event) {
      if (mouseDown) {
        rotationX += (event.clientY - mouseY) * 0.01;
        rotationY += (event.clientX - mouseX) * 0.01;
        mouseX = event.clientX;
        mouseY = event.clientY;
      }
    }

    function onMouseUp() {
      mouseDown = false;
    }
  </script>
</body>
</html>
