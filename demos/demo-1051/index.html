<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
    html, body { margin:0; padding:0; overflow:hidden; background:#000; }
    canvas { display:block; }
    #title {
        position:absolute;
        top:10px;
        left:10px;
        color:#fff;
        font-family:monospace;
        font-size:18px;
        pointer-events:none;
    }
</style>
</head>
<body>
<div id="title">My Awesome 3D Scene</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Resize handling
    window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    });

    // Lights
    const ambient = new THREE.AmbientLight(0x404040, 2);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffaa33, 1.2, 50);
    pointLight.position.set(-5, 5, -5);
    scene.add(pointLight);

    // Group for objects
    const group = new THREE.Group();
    scene.add(group);

    // Torus Knot
    const knotGeom = new THREE.TorusKnotGeometry(1, 0.35, 150, 20);
    const knotMat = new THREE.MeshStandardMaterial({ 
        color: 0x156289, 
        emissive: 0x072534, 
        metalness: 0.7, 
        roughness: 0.2,
        side: THREE.DoubleSide
    });
    const knot = new THREE.Mesh(knotGeom, knotMat);
    group.add(knot);

    // Surrounding spheres
    const sphereGeom = new THREE.SphereGeometry(0.3, 32, 32);
    const colors = [0xff5555, 0x55ff55, 0x5555ff, 0xffff55, 0xff55ff];
    for (let i = 0; i < 20; i++) {
        const mat = new THREE.MeshStandardMaterial({ 
            color: colors[i % colors.length],
            metalness: 0.5,
            roughness: 0.4
        });
        const sphere = new THREE.Mesh(sphereGeom, mat);
        const phi = Math.acos(2 * Math.random() - 1);
        const theta = 2 * Math.PI * Math.random();
        const radius = 2 + Math.random() * 1.5;
        sphere.position.setFromSphericalCoords(radius, phi, theta);
        group.add(sphere);
    }

    // Mouse drag rotation
    let isDragging = false;
    let previousMouse = { x: 0, y: 0 };
    const rotationSpeed = 0.005;

    const onMouseDown = (e) => {
        isDragging = true;
        previousMouse.x = e.clientX;
        previousMouse.y = e.clientY;
    };
    const onMouseMove = (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMouse.x;
        const deltaY = e.clientY - previousMouse.y;
        previousMouse.x = e.clientX;
        previousMouse.y = e.clientY;
        group.rotation.y += deltaX * rotationSpeed;
        group.rotation.x += deltaY * rotationSpeed;
        // Clamp X rotation to avoid flipping
        group.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, group.rotation.x));
    };
    const onMouseUp = () => { isDragging = false; };
    const onMouseLeave = () => { isDragging = false; };

    renderer.domElement.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
    window.addEventListener('mouseleave', onMouseLeave);
    // Touch support
    renderer.domElement.addEventListener('touchstart', (e)=>{ 
        if(e.touches.length===1){ 
            isDragging=true; 
            previousMouse.x=e.touches[0].clientX; 
            previousMouse.y=e.touches[0].clientY; 
        } 
    });
    window.addEventListener('touchmove', (e)=>{ 
        if(isDragging && e.touches.length===1){ 
            const deltaX = e.touches[0].clientX - previousMouse.x;
            const deltaY = e.touches[0].clientY - previousMouse.y;
            previousMouse.x = e.touches[0].clientX;
            previousMouse.y = e.touches[0].clientY;
            group.rotation.y += deltaX * rotationSpeed;
            group.rotation.x += deltaY * rotationSpeed;
            group.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, group.rotation.x));
        }
    });
    window.addEventListener('touchend',()=>{ isDragging=false; });

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);
        // Slow automatic spin
        group.rotation.y += 0.001;
        renderer.render(scene, camera);
    }
    animate();
})();
</script>
</body>
</html>
