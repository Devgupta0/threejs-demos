<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html, body { margin:0; overflow:hidden; }
  #title {
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-family:monospace;
    font-size:18px;
    pointer-events:none;
    z-index:1;
  }
</style>
</head>
<body>
<div id="title">Three.js Impressive Scene</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x000000);
  document.body.appendChild(renderer.domElement);

  // Scene & Camera
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 2, 6);
  camera.lookAt(0, 0, 0);

  // Group that will be rotated by mouse
  const world = new THREE.Group();
  scene.add(world);

  // Lights
  const ambient = new THREE.AmbientLight(0x404040, 1.2);
  scene.add(ambient);

  const point1 = new THREE.PointLight(0xffaa33, 2, 0, 2);
  point1.position.set(5, 5, 5);
  scene.add(point1);

  const point2 = new THREE.PointLight(0x33aaff, 2, 0, 2);
  point2.position.set(-5, -5, -5);
  scene.add(point2);

  // Central object - TorusKnot
  const knotGeo = new THREE.TorusKnotGeometry(1, 0.3, 150, 20);
  const knotMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    metalness: 0.7,
    roughness: 0.2,
    emissive: 0x111111
  });
  const knot = new THREE.Mesh(knotGeo, knotMat);
  world.add(knot);

  // Surrounding floating spheres
  const sphereGeo = new THREE.SphereGeometry(0.12, 16, 16);
  const sphereMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, metalness: 0.5, roughness: 0.4 });
  const sphereCount = 200;
  for (let i = 0; i < sphereCount; i++) {
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = 2 * Math.PI * Math.random();
    const radius = 2.5 + Math.random() * 0.5;
    sphere.position.set(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.sin(phi) * Math.sin(theta),
      radius * Math.cos(phi)
    );
    world.add(sphere);
  }

  // Animation
  function animate() {
    requestAnimationFrame(animate);
    // Slowly rotate the knot itself
    knot.rotation.x += 0.005;
    knot.rotation.y += 0.01;
    // Slight global rotation for subtle motion
    world.rotation.y += 0.0005;
    renderer.render(scene, camera);
  }
  animate();

  // Mouse drag controls
  let isDragging = false;
  let previousMouse = { x: 0, y: 0 };
  const rotationSpeed = 0.005;

  function onPointerDown(event) {
    isDragging = true;
    previousMouse.x = event.clientX;
    previousMouse.y = event.clientY;
  }

  function onPointerMove(event) {
    if (!isDragging) return;
    const deltaX = event.clientX - previousMouse.x;
    const deltaY = event.clientY - previousMouse.y;
    world.rotation.y += deltaX * rotationSpeed;
    world.rotation.x += deltaY * rotationSpeed;
    previousMouse.x = event.clientX;
    previousMouse.y = event.clientY;
  }

  function onPointerUp() {
    isDragging = false;
  }

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointerleave', onPointerUp);

  // Resize handling
  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });
})();
</script>
</body>
</html>
