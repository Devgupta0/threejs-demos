<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater Scene</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
        }
        #title {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: monospace;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="title">Underwater Scene</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, fish, coral, jellyfish, city, aurora;
        let mouseX = 0, mouseY = 0;
        let rotX = 0, rotY = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 500;

            renderer = new THREE.WebGLRenderer({
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Fish
            const fishGeometry = new THREE.SphereGeometry(10, 16, 16);
            const fishMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            fish = [];
            for (let i = 0; i < 500; i++) {
                const fishMesh = new THREE.Mesh(fishGeometry, fishMaterial);
                fishMesh.position.x = Math.random() * 1000 - 500;
                fishMesh.position.y = Math.random() * 1000 - 500;
                fishMesh.position.z = Math.random() * 1000 - 500;
                scene.add(fishMesh);
                fish.push(fishMesh);
            }

            // Coral
            const coralGeometry = new THREE.BoxGeometry(50, 50, 50);
            const coralMaterial = new THREE.MeshBasicMaterial({ color: 0xff99cc });
            for (let i = 0; i < 20; i++) {
                const coralMesh = new THREE.Mesh(coralGeometry, coralMaterial);
                coralMesh.position.x = Math.random() * 1000 - 500;
                coralMesh.position.y = Math.random() * 1000 - 500;
                coralMesh.position.z = Math.random() * 1000 - 500;
                scene.add(coralMesh);
            }

            // Jellyfish
            const jellyfishGeometry = new THREE.SphereGeometry(20, 16, 16);
            const jellyfishMaterial = new THREE.MeshBasicMaterial({ color: 0x66ffff });
            jellyfish = [];
            for (let i = 0; i < 50; i++) {
                const jellyfishMesh = new THREE.Mesh(jellyfishGeometry, jellyfishMaterial);
                jellyfishMesh.position.x = Math.random() * 1000 - 500;
                jellyfishMesh.position.y = Math.random() * 1000 - 500;
                jellyfishMesh.position.z = Math.random() * 1000 - 500;
                scene.add(jellyfishMesh);
                jellyfish.push(jellyfishMesh);
            }

            // City
            const cityGeometry = new THREE.BoxGeometry(100, 100, 100);
            const cityMaterial = new THREE.MeshBasicMaterial({ color: 0x999999 });
            city = new THREE.Mesh(cityGeometry, cityMaterial);
            city.position.z = -1000;
            scene.add(city);

            // Aurora
            aurora = new THREE.PointLight(0x99ff00, 1, 1000);
            aurora.position.y = 500;
            scene.add(aurora);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x444444);
            scene.add(ambientLight);

            // Event listeners
            document.addEventListener('mousemove', (event) => {
                mouseX = event.clientX - window.innerWidth / 2;
                mouseY = event.clientY - window.innerHeight / 2;
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Fish movement
            for (let i = 0; i < fish.length; i++) {
                fish[i].position.x += Math.sin(Date.now() * 0.001 + i) * 0.1;
                fish[i].position.y += Math.cos(Date.now() * 0.001 + i) * 0.1;
                fish[i].position.z += Math.sin(Date.now() * 0.001 + i) * 0.1;
            }

            // Jellyfish movement
            for (let i = 0; i < jellyfish.length; i++) {
                jellyfish[i].position.x += Math.sin(Date.now() * 0.001 + i) * 0.05;
                jellyfish[i].position.y += Math.cos(Date.now() * 0.001 + i) * 0.05;
                jellyfish[i].position.z += Math.sin(Date.now() * 0.001 + i) * 0.05;
            }

            // Aurora movement
            aurora.position.x = Math.sin(Date.now() * 0.001) * 500;
            aurora.position.z = Math.cos(Date.now() * 0.001) * 500;

            // Camera rotation
            rotX += mouseX * 0.001;
            rotY += mouseY * 0.001;
            camera.position.x = rotX * 100;
            camera.position.y = rotY * 100;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
