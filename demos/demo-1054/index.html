<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Demo</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; }
  #title {
    position:absolute;
    top:10px; left:10px;
    color:#fff;
    font-family:monospace;
    font-size:1.2rem;
    pointer-events:none;
    z-index:1;
  }
</style>
</head>
<body>
<div id="title">Three.js Demo</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 2, 6);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setClearColor(0x000000);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0x404040, 1.5);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  const pointLight = new THREE.PointLight(0xffaa00, 1.5, 0, 2);
  pointLight.position.set(-4, 4, -4);
  scene.add(pointLight);

  // Group for all objects (to rotate via mouse)
  const group = new THREE.Group();
  scene.add(group);

  // Torus Knot
  const knotGeom = new THREE.TorusKnotGeometry(1, 0.3, 150, 20);
  const knotMat = new THREE.MeshStandardMaterial({
    color: 0x156289,
    emissive: 0x072534,
    metalness: 0.7,
    roughness: 0.2,
    envMapIntensity: 1
  });
  const knot = new THREE.Mesh(knotGeom, knotMat);
  group.add(knot);

  // Floating cubes
  const cubeGeom = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const cubeMat = new THREE.MeshStandardMaterial({ color: 0xff5555, metalness: 0.4, roughness: 0.6 });
  for (let i = 0; i < 8; i++) {
    const cube = new THREE.Mesh(cubeGeom, cubeMat);
    const angle = (i / 8) * Math.PI * 2;
    const radius = 2.5;
    cube.position.set(
      Math.cos(angle) * radius,
      (Math.random() - 0.5) * 2,
      Math.sin(angle) * radius
    );
    cube.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    group.add(cube);
  }

  // Ground plane (just for visual reference)
  const planeGeom = new THREE.PlaneGeometry(20, 20);
  const planeMat = new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide });
  const plane = new THREE.Mesh(planeGeom, planeMat);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -1.2;
  scene.add(plane);

  // Mouse drag rotation
  let isDragging = false;
  let previousMouse = { x: 0, y: 0 };
  const rotateSpeed = 0.005;

  const onPointerDown = (e) => {
    isDragging = true;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
  };
  const onPointerMove = (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMouse.x;
    const deltaY = e.clientY - previousMouse.y;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
    group.rotation.y += deltaX * rotateSpeed;
    group.rotation.x += deltaY * rotateSpeed;
  };
  const onPointerUp = () => { isDragging = false; };
  const onPointerLeave = () => { isDragging = false; };

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
  renderer.domElement.addEventListener('pointerleave', onPointerLeave);
  renderer.domElement.addEventListener('pointercancel', onPointerUp);

  // Resize handling
  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  // Animation loop
  const clock = new THREE.Clock();
  const animate = () => {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    // Slowly spin the knot on its own axis
    knot.rotation.x += delta * 0.4;
    knot.rotation.y += delta * 0.6;

    // Subtle bobbing of cubes
    group.children.forEach((obj, idx) => {
      if (obj !== knot) {
        obj.position.y += Math.sin(clock.elapsedTime * 2 + idx) * 0.001;
      }
    });

    renderer.render(scene, camera);
  };
  animate();
})();
</script>
</body>
</html>
